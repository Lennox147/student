<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Admin Dashboard</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="topbar">
    <h1>Student Registrations</h1>
    <div>
      <button id="export">Export CSV</button>
      <button id="logout">Logout</button>
    </div>
  </header>

  <main class="dashboard">
    <div class="filters">
      <input id="search" placeholder="Search name or admission number">
      <select id="course"><option value="">All courses</option></select>
      <button id="refresh">Refresh</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th><th>Admission No.</th><th>DOB</th><th>Gender</th>
            <th>Email</th><th>Phone</th><th>Course</th><th>Year</th>
            <th>Institution</th><th>County</th><th>Registered</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
